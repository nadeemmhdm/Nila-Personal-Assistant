[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nila-personal-assistant"
version = "0.2.0"
description = "A local-first personal assistant with an animated web interface and a shared Ollama-powered CLI."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "platformdirs>=4,<5", "cryptography>=44,<52"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
nila = "nila.cli:main"

[tool.setuptools.packages.find]
include = ["nila*"]

[tool.setuptools.package-data]
nila = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
