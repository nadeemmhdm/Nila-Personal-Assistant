name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Parse Windows installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/launcher.ps1', 'scripts/setup.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - run: python scripts/build_binary.py
      - name: Binary smoke check
        shell: bash
        run: ./dist/nila --version
      - uses: actions/upload-artifact@v4
        with:
          name: nila-${{ runner.os }}
          path: dist/nila*
