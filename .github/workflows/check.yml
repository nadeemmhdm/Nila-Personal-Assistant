name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP broker test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-curl php-sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Parse Windows installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/launcher.ps1', 'scripts/setup.ps1', 'scripts/update-release.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Parse native speech script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $speechSource = (python -c "from nila.voice import SCRIPT; print(SCRIPT)") -join "`n"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($speechSource, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Windows short-path dependency regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_paths.ps1
      - run: python scripts/build_binary.py
      - name: Release updater activation and integrity regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release_update.ps1
      - name: Packaged Web assets and About page
        run: python scripts/smoke_web.py
      - name: Binary smoke check
        shell: bash
        run: ./dist/nila --version
      - uses: actions/upload-artifact@v4
        with:
          name: nila-${{ runner.os }}
          path: dist/nila*

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish tested stable version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          cp artifacts/nila-Windows/nila.exe nila-Windows.exe
          cp artifacts/nila-Linux/nila nila-Linux
          sha256sum nila-Windows.exe nila-Linux > SHA256SUMS
          gh release create "$tag" nila-Windows.exe nila-Linux SHA256SUMS --target "$GITHUB_SHA" --title "Nila $version — Personal Workspace" --notes-file "docs/releases/$tag.md"
