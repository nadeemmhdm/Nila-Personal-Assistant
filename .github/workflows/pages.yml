name: Nila landing page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nila-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node scripts/build_landing.mjs
      - name: Save deployable static website
        uses: actions/upload-artifact@v4
        with:
          name: nila-landing-site
          path: web/public/about
          include-hidden-files: true
      - name: Check Pages setup
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/nila-pages.json" --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = '404' ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Website built, but NOT deployed: GitHub Pages is disabled. Enable Settings → Pages → Source: GitHub Actions, then run this workflow again.'
            echo '### Website built — deployment needs one-time setup' >> "$GITHUB_STEP_SUMMARY"
            echo 'Open Settings → Pages → Source: GitHub Actions. Then run **Nila landing page** using Run workflow. The nila-landing-site artifact is available now. No public site was deployed by this run.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = '200' ]; then
            if [ "$(jq -r '.build_type' "$RUNNER_TEMP/nila-pages.json")" = 'workflow' ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            else
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo '::notice::Set Settings → Pages → Source to GitHub Actions, then rerun. The built website is available as an artifact.'
              echo '### Not deployed: select GitHub Actions as the Pages source and rerun.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::error::Cannot check GitHub Pages configuration (HTTP $status). Check repository permissions."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: web/public/about
  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
